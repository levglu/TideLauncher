name: Release

# Сборка Linux- и Windows-версий и публикация релиза.
# Запускается при пуше тега вида v1.0.0 или вручную (Actions → Release → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 \
            libpulse0 libasound2

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyside6==6.8.*" "pyinstaller==6.*"

      - name: Сборка
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Tide \
            --icon icons/tide.ico \
            --add-data "Main.qml:." --add-data "fonts:fonts" --add-data "shaders:shaders" --add-data "icons:icons" \
            --hidden-import PySide6.QtMultimedia \
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization \
            main.py
          cp README.md LICENSE dist/Tide/

      - name: Проверка запуска собранной версии
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          exe=dist/Tide/Tide; [ "$RUNNER_OS" = "Windows" ] && exe=dist/Tide/Tide.exe
          set +e
          "$exe" --windowed --skip-intro --shot "$PWD/smoke.png:4000" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          # настоящие ошибки: интерфейс не загрузился, нет модуля QML, исключение Python
          if grep -E "QQmlApplicationEngine failed|is not installed|module \".*\" .*not|Traceback" smoke.log; then
            echo "::error::Ошибки при загрузке интерфейса"; exit 1
          fi
          if [ "$code" != "0" ]; then echo "::error::Программа завершилась с кодом $code"; exit 1; fi
          test -s smoke.png || { echo "::error::Снимок экрана не сделан"; exit 1; }
          echo "Интерфейс загрузился, снимок экрана сделан"

      - name: Снимок экрана из проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke.png
          if-no-files-found: ignore

      - name: Архив
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../Tide-${{ matrix.name }}.zip Tide > /dev/null
          else
            tar -czf ../Tide-${{ matrix.name }}.tar.gz Tide
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tide-${{ matrix.name }}
          path: |
            Tide-${{ matrix.name }}.zip
            Tide-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          gh release create "$TAG" out/* --title "Tide $TAG" --notes-file .github/release-notes.md --verify-tag
